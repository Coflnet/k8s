{{- $frontend := .Values.bfcsRemoteTlsFrontend | default dict }}
{{- if $frontend.enabled }}
{{- $name := "sky-bfcs-redis-frontend" }}
{{- if not $frontend.allowedSourceCIDRs }}{{ fail "BFCS remote TLS requires reviewed consumer source CIDRs" }}{{ end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-tls
spec:
  secretName: {{ $name }}-tls
  duration: 24h
  renewBefore: 8h
  issuerRef: {kind: Issuer, name: {{ required "BFCS remote Issuer required" $frontend.issuer }}}
  privateKey: {algorithm: ECDSA, size: 384, rotationPolicy: Always}
  commonName: sky-bfcs-redis.{{ .Release.Namespace }}.{{ required "BFCS cluster name required" $frontend.cluster }}.coflnet.internal
  dnsNames:
  - sky-bfcs-redis.{{ .Release.Namespace }}.{{ $frontend.cluster }}.coflnet.internal
  - {{ $name }}-tls.{{ .Release.Namespace }}.svc.cluster.local
  ipAddresses: [{{ required "BFCS remote IP required" $frontend.remoteIP | quote }}]
  usages: [digital signature, server auth]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sky-bfcs-redis-frontend-config
data:
  nginx.conf: |
{{ .Files.Get "files/redis-tls-frontend.conf" | indent 4 }}
  reload-tls.sh: |
{{ .Files.Get "files/redis-tls-frontend-reload.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky-bfcs-redis-frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: sky-bfcs-redis-frontend}
  template:
    metadata:
      labels: {app: sky-bfcs-redis-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app: sky-bfcs-redis}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend
        image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
        command: [/bin/sh, -ec]
        args:
        - |
          dns=$(awk '/^nameserver / {print $2; exit}' /etc/resolv.conf)
          test -n "$dns"
          sed "s/CLUSTER_DNS/$dns/g; s/REDIS_LOCAL_BACKEND/sky-bfcs-redis-frontend-local.{{ .Release.Namespace }}.svc.cluster.local/g" /frontend/nginx.conf > /tmp/nginx.conf
          inotifyd /frontend/reload-tls.sh /optional-tls:yn &
          echo "$!" > /tmp/tls-watcher.pid
          exec nginx -c /tmp/nginx.conf -g 'daemon off;'
        ports: [{name: redis-tls, containerPort: 6380}]
        readinessProbe:
          exec:
            command: [/bin/sh, -ec, 'test ! -e /tmp/tls-reload-failed && nc -z -w 2 127.0.0.1 6380 && nc -z -w 2 sky-bfcs-redis-frontend-local.{{ .Release.Namespace }}.svc.cluster.local 6379']
          timeoutSeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [/bin/sh, -ec, 'kill -0 "$(cat /tmp/nginx.pid)"; kill -0 "$(cat /tmp/tls-watcher.pid)"']
          periodSeconds: 15
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: config, mountPath: /frontend, readOnly: true}
        - {name: redis-optional-tls, mountPath: /optional-tls, readOnly: true}
        - {name: temporary, mountPath: /tmp}
      volumes:
      - {name: config, configMap: {name: sky-bfcs-redis-frontend-config, defaultMode: 0555}}
      - name: redis-optional-tls
        projected:
          defaultMode: 0440
          sources:
          - secret: {name: sky-bfcs-redis-frontend-tls}
          - configMap:
              name: bfcs-redis-frontend-root-trust
              items: [{key: ca.crt, path: ca.crt}]
      - name: temporary
        emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sky-bfcs-redis-frontend-local
  labels: {maintenance.coflnet.com/drain-policy: block}
  annotations: {maintenance.coflnet.com/max-downtime-seconds: "0"}
spec:
  internalTrafficPolicy: Local
  selector:
    app: sky-bfcs-redis
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: sky-bfcs-redis-frontend-tls
  labels: {maintenance.coflnet.com/drain-policy: block}
  annotations: {maintenance.coflnet.com/max-downtime-seconds: "0"}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app: sky-bfcs-redis-frontend}
  ports: [{name: redis-tls, port: 6380, targetPort: redis-tls, nodePort: 31380}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sky-bfcs-redis-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: sky-bfcs-redis-frontend}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-bfcs-redis-frontend
spec:
  podSelector: {matchLabels: {app: sky-bfcs-redis-frontend}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: sky-bfcs}}
    {{- range $frontend.allowedSourceCIDRs }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
    ports: [{protocol: TCP, port: 6380}]
  egress:
  - to:
    - podSelector:
        matchLabels: {app: sky-bfcs-redis}
    ports: [{protocol: TCP, port: 6379}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-bfcs-redis-frontend-backend
spec:
  podSelector:
    matchLabels: {app: sky-bfcs-redis}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: sky-bfcs-redis-frontend}}}]
    ports: [{protocol: TCP, port: 6379}]
---
# Add only TLS routes for local BFCS consumers; preserve every existing route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-bfcs-redis-frontend-consumers
spec:
  podSelector: {matchLabels: {app: sky-bfcs}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: sky-bfcs-redis-frontend}}}]
    ports: [{protocol: TCP, port: 6380}]
{{- end }}
