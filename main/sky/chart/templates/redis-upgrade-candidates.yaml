{{- range (.Values.redisUpgrade | default dict).candidates }}
{{- $name := required "redisUpgrade.candidates[].name is required" .name }}
{{- $route := required "redisUpgrade.candidates[].route is required" .route }}
{{- $class := required "redisUpgrade.candidates[].storageClassName is required" .storageClassName }}
{{- if or (eq $name "sky-event-broker-redis") (eq $name "sky-bfcs-redis") }}{{ fail "Broker and BFCS do not use replica handoff" }}{{ end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-upgrade
  annotations:
    helm.sh/resource-policy: keep
    storage.coflnet.com/desired-longhorn-replicas: "2"
spec:
  accessModes: [ReadWriteOnce]
  {{- with (lookup "v1" "PersistentVolumeClaim" $.Release.Namespace (printf "%s-upgrade" $name)) }}
  {{- with .spec.volumeName }}
  volumeName: {{ . | quote }}
  {{- end }}
  {{- end }}
  storageClassName: {{ $class | quote }}
  resources:
    requests:
      storage: {{ .storageSize | default "1Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-upgrade
  {{- if .disableAutomaticRdb }}
  annotations:
    redis.coflnet.com/disable-automatic-rdb: "true"
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      redis-upgrade-candidate: {{ $name }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: redis
      labels:
        app: {{ $name }}
        redis-upgrade-candidate: {{ $name }}
        redis-route: {{ $route | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      initContainers:
      - name: redis-config
        image: {{ .image | default "redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c" }}
        command: [sh, -ec]
        args:
        - |
          if [ ! -e /data/redis.conf ]; then
            umask 077
            {
              printf 'dir /data\nprotected-mode no\nsave 5 1\nappendonly yes\nappendfsync everysec\nreplicaof 127.0.0.1 1\n'
            } > /data/redis.conf
          fi
          test -s /data/redis.conf
          chmod 600 /data/redis.conf
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: redis
        image: {{ .image | default "redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c" }}
        args: [/data/redis.conf]
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - 'test -f /data/active && test "$(redis-cli --raw ROLE | head -1)" = master'
          periodSeconds: 2
          failureThreshold: 1
        livenessProbe:
          exec:
            command: [sh, -ec, 'test "$(redis-cli --raw PING)" = PONG']
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: {{ .memoryRequest | default "256Mi" }}
            cpu: 50m
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ $name }}-upgrade
{{- end }}
