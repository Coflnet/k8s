enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyeventbroker
  tag: a1a11602cd61fc00fbe2f270688c82f594fcd1db@sha256:445c6bda66cf458ba65a218e9461c8f099f2a82b7d9a8c044620a7675b866651
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 100Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_eventmessages_database

  - name: COCKROACH_DB_CONNECTION
    valueFrom:
      secretKeyRef:
        key: connection_cockroach_event_database
        name: secret

  - name: TOPICS__VERIFIED
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_verified

  - name: TOPICS__TRANSACTIONS
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_transaction

  - name: TOPICS__PAYMENTS
    value: sky-payments

  - name: LEGAL_MANIFEST_URL
    value: https://coflnet.com/legal/manifest.json

  - name: SMTP_PORT
    value: "587"

  - name: SMTP_FROM
    value: noreply@coflnet.com

  - name: FIREBASE_SENDER_ID
    valueFrom:
      secretKeyRef:
        name: secret
        key: firebase_sender_id
  - name: FIREBASE_KEY
    valueFrom:
      secretKeyRef:
        name: secret
        key: firebase_key

# Optional small Redis persistence for notifications and Bazaar snapshots.
redis:
  persistence:
    enabled: false
    size: 200M
    storageClassName: ""
  # Leave room for the current and replacement RDB files during background saves.
  maxmemory: 50mb
