enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyeventbroker
  tag: 86f90ae6f53747ed65dcb3ede8a8c42eb9a716cb@sha256:38a25586cf4ccafd4a1e425dcdf3e3ec38fc43783e395fb4c0e0954b0f5d5ab0
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 100Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_eventmessages_database

  - name: COCKROACH_DB_CONNECTION
    valueFrom:
      secretKeyRef:
        key: connection_cockroach_event_database
        name: secret

  - name: TOPICS__VERIFIED
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_verified

  - name: TOPICS__TRANSACTIONS
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_transaction

  - name: TOPICS__PAYMENTS
    value: sky-payments

  - name: LEGAL_MANIFEST_URL
    value: https://coflnet.com/legal/manifest.json

  - name: SMTP_PORT
    value: "587"

  - name: SMTP_FROM
    value: noreply@coflnet.com

  - name: FIREBASE_SENDER_ID
    valueFrom:
      secretKeyRef:
        name: secret
        key: firebase_sender_id
  - name: FIREBASE_KEY
    valueFrom:
      secretKeyRef:
        name: secret
        key: firebase_key

# Optional small Redis persistence for notifications and Bazaar snapshots.
redis:
  persistence:
    enabled: false
    size: 200M
    storageClassName: ""
  # Leave room for the current and replacement RDB files during background saves:
  # persistence.size must be at least ~2x maxmemory. With noeviction a full
  # Redis rejects every write (publications fail with OOM), so size it for the
  # peak: ~600 user snapshots of up to 1 MiB plus ~100k fill-dedupe keys.
  maxmemory: 50mb
  # Container memory request; keep it above maxmemory plus fragmentation (~1.4x).
  memoryRequest: 200Mi

pki:
  enabled: false
  applicationEnabled: false
