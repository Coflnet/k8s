{{ if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-redis
  labels:
    app: {{ .Chart.Name }}-redis
spec:
  replicas: 1
  {{- if .Values.redis.persistence.enabled }}
  strategy:
    type: Recreate # A single Redis process owns the RWO snapshot volume.
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-redis
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-redis
    spec:
      automountServiceAccountToken: false
      {{- if .Values.redis.persistence.enabled }}
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}-redis
        image: redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c
        {{- if .Values.redis.persistence.enabled }}
        args:
          - --dir
          - /data
          - --save
          - "5 1"
          - --appendonly
          - "no"
          - --maxmemory
          - {{ .Values.redis.maxmemory | quote }}
          - --maxmemory-policy
          - noeviction
        volumeMounts:
          - name: data
            mountPath: /data
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          exec:
            command: [sh, -ec, 'test "$(redis-cli --raw PING)" = PONG']
          periodSeconds: 1
        ports:
        - containerPort: 6379
        resources:
          limits: {}
          requests:
            memory: "200Mi"
            cpu: "50m"
      {{- if .Values.redis.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-redis
      {{- end }}
{{- if .Values.redis.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-redis
  annotations:
    helm.sh/resource-policy: keep
    {{- if eq .Values.redis.persistence.storageClassName "longhorn-encrypted" }}
    storage.coflnet.com/desired-longhorn-replicas: "2"
    {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- /* Helm replacement updates must preserve the dynamically assigned binding. */}}
  {{- with (lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-redis" .Chart.Name)) }}
  {{- with .spec.volumeName }}
  volumeName: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.redis.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-redis
  labels:
    mirror.linkerd.io/exported: "true"
spec:
  selector:
    app: {{ .Chart.Name }}-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
{{ end }}
