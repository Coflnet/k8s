{{ if .Values.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: prometheus
  name: {{ .Chart.Name }}-rules
spec:
  groups:
    - name: "{{ .Chart.Name }}.rules"
      rules:
        - alert: PurchaseConfirmationDeliveryParked
          expr: increase(sky_eventbroker_purchase_confirmation_parked_total[15m]) > 0
          labels:
            severity: critical
            project: skyblock
          annotations:
            summary: "A purchase confirmation could not be delivered"
            description: "At least one purchase confirmation exhausted all delivery retries and requires operator review."
        - alert: PurchaseConfirmationRecipientMissing
          expr: increase(sky_eventbroker_purchase_confirmation_no_email[15m]) > 0
          labels:
            severity: critical
            project: skyblock
          annotations:
            summary: "A purchase confirmation has no recipient"
            description: "At least one purchase confirmation could not be queued because no email address was found for the purchaser."
---
{{ end }}
