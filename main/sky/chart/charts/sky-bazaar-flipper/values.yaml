enabled: true
replicaCount: 2

strategy: RollingUpdate
image:
  repository: muehlhansfl/skybazaarflipper
  tag: d5a2afd91b38f0e462bad9148414f90b5994beef@sha256:20e3061bf1f0680542e7e5f4e3d7e2daacf0bb26b041e1f870e60f51729a2f14
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 350Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 20
  periodSeconds: 3


pki:
  enabled: false
  applicationEnabled: false
