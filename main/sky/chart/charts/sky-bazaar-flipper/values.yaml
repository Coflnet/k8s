  tag: 3dc77bf9cea1f7e0ca27fb74914b11a3d724f331@sha256:93eaf287e60a6d76182cd812cd4bb666f42eb2547a72a0bc8df9ffe47552eace
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 350Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 20
  periodSeconds: 3

