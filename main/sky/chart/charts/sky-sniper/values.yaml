enabled: true
replicaCount: 3

strategy: RollingUpdate

image:
  repository: muehlhansfl/skysniper
  tag: d8113909e803435a570a9df90458cd5fd69c9247@sha256:f95cd01d5b311203647fdaf4a1553e2196b83ec8e4cef2b235e6722aa6fa5a43
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 1000m
    memory: 4Gi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

nodeSelector:
  hetzner: "true"

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 100
liveProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 1200
  periodSeconds: 5
  failureThreshold: 60

master:
  replicaCount: 1
  strategy: Recreate

worker:
  replicaCount: 2
  strategy: RollingUpdate

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        key: connection_read_secondary
        name: secret

  - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
    valueFrom:
      configMapKeyRef:
        key: reload_config_on_change
        name: config

  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        key: jwt_secret_sniper
        name: secret
