enabled: true
# Switches the AI flip finder of this service on or off (AI_FINDER__ENABLED)
aiFinderEnabled: true
# Item tags the AI finder trains, values and publishes, comma separated; empty means every tag (AI_FINDER__TAGS)
aiFinderTags: "HYPERION,TERMINATOR"
# Values gems by slot and quality instead of per gem type; must match on every instance, or stored models are not found (AI_FINDER__GEM_SLOTS)
aiFinderGemSlots: true
# Fits the trees on the residual of the level model, so they follow fast price moves; read by the trainer (AI_FINDER__TREES_ON_LEVEL)
aiFinderTreesOnLevel: true
# Rare modifier premiums are measured against plain sales of the same days (AI_FINDER__RARE_PLAIN_DRIFT)
aiFinderRarePlainDrift: true
# One value per rune, higher levels scaled like fusing (AI_FINDER__RARE_LINK_RUNES)
aiFinderRareLinkRunes: true
# Shrinks rare premiums by how much sellers disagree, so one seller is never trusted (AI_FINDER__RARE_SHRINK: Fixed or Empirical)
aiFinderRareShrink: "Empirical"
# Caps a rare modifier's premium at its current cost plus an allowance; nothing is valued before the first cost snapshot (AI_FINDER__RARE_COST_CAP)
aiFinderRareCostCap: true
replicaCount: 3

strategy: RollingUpdate

image:
  repository: muehlhansfl/skysniper
  tag: 8676c3052547beedb27340d2eb9efd9a90884aa4@sha256:d20bab73d72fe2bd073bd3bf41d2ee14dac19d3ccaaf8ec1ade7bcedaea461c6
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 1000m
    memory: 4Gi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

nodeSelector:
  hetzner: "true"

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 100
liveProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 1200
  periodSeconds: 5
  failureThreshold: 60

master:
  replicaCount: 1
  strategy: Recreate

worker:
  replicaCount: 2
  strategy: RollingUpdate

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        key: connection_read_secondary
        name: secret

  - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
    valueFrom:
      configMapKeyRef:
        key: reload_config_on_change
        name: config

  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        key: jwt_secret_sniper
        name: secret

pki:
  enabled: false
  applicationEnabled: false
