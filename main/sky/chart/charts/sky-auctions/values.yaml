enabled: true
replicaCount: 1

strategy: RollingUpdate
image:
  repository: muehlhansfl/skyauctions
  tag: 17c1adf1adc05e58ce0b85cdebc9002243298828@sha256:5e4b3048633947fa8ad953ef34e8e0cf3766b776ac4a469feb1cad569de2b994
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 8000Mi # runs out of memory sometimes but not very important so kills it if it does

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /metrics
    port: api
  initialDelaySeconds: 20
  periodSeconds: 3

envVars:
  - name: S3__BUCKET_NAME
    value: "sky-auctions-archive"
  - name: S3__ENABLED
    value: "true"
  # Auction archive phase 2 (Scylla -> R2 sweep, SkyAuctions MIGRATION.md "Phase 2 (v2 blobs)"); needs DBConnection, enabled per cluster
  - name: ARCHIVE__ENABLED
    value: "false"
  - name: CASSANDRA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: CASSANDRA__USER
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: auctions_username
  - name: CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: auctions-password
  - name: CASSANDRA__X509Certificate_PATHS
    value: /tls/scylla/secret/db.pfx
  - name: CASSANDRA__X509Certificate_PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: db-pfx-password
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        key: connection_live
        name: secret
