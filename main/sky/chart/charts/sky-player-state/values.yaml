enabled: true
replicaCount: 3

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyplayerstate
  tag: 86244266fe900d0760b99531bbf96028a31dd5ea@sha256:954cb6712b9b376bfa4f64484bfa8fe9c32113d87295b6061336575d52f7df48
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 300m
    memory: 900Mi
  limits:
    memory: 1500Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  periodSeconds: 3

envVars:
  # mongo
  - name: Mongo__ConnectionString
    valueFrom:
      secretKeyRef:
        name: secret
        key: mongo_url

  # cassandra

  - name: CASSANDRA__KEYSPACE
    value: sky_item_movement

  - name: SCYLLA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: SCYLLA__USER
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: player_state_user
#  - name: SCYLLA__PASSWORD # loaded from openbao
  - name: SCYLLA__X509Certificate_PATHS
    value: /tls/scylla/secret/db.pfx
  - name: SCYLLA__X509Certificate_PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: db-pfx-password
