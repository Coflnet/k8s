enabled: true
replicaCount: 3

strategy: RollingUpdate

# Certificate issuance, client/trust/HOME mounts and application TLS are separate EU-only phases
# (see chart/player-state-pki-eu.yaml). Everything defaults off; other clusters never enable it.
pki:
  enabled: false
  # Mount the projected client certificate, trust bundle and writable HOME without any application setting.
  mountsEnabled: false
  applicationEnabled: false
  # Move the kubelet readinessProbe to /health/ready (semantic CQL check) BEFORE the application TLS flip.
  readinessEnabled: false
  homeEnv: {}
  env: {}

image:
  repository: muehlhansfl/skyplayerstate
  tag: fddf15dbdb2867d3c892088142826e6f123663c7@sha256:42980a141ba2fd846e0f13be6c22333699552e0ad753e29c666ea52c88630e47
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 300m
    memory: 900Mi
  limits:
    memory: 1500Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  # mongo
  - name: Mongo__ConnectionString
    valueFrom:
      secretKeyRef:
        name: secret
        key: mongo_url

  # cassandra

  - name: CASSANDRA__KEYSPACE
    value: sky_item_movement

  - name: SCYLLA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: SCYLLA__USER
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: player_state_user
#  - name: SCYLLA__PASSWORD # loaded from openbao
  - name: SCYLLA__X509Certificate_PATHS
    value: /tls/scylla/secret/db.pfx
  - name: SCYLLA__X509Certificate_PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: db-pfx-password
