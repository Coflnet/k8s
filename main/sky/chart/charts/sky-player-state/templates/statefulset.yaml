{{ if .Values.enabled }}
{{- $pkiPrepared := and .Values.pki.enabled (or .Values.pki.mountsEnabled .Values.pki.applicationEnabled) }}
{{- $pkiApplication := and .Values.pki.enabled .Values.pki.applicationEnabled }}
{{- $legacyScyllaExclude := ternary (list "Mongo__ConnectionString") (list) (not (empty $.Values.global.openbaoAuthPath)) }}
{{- if $pkiApplication }}
{{- $legacyScyllaExclude = concat $legacyScyllaExclude (list "SCYLLA__X509Certificate_PATHS" "SCYLLA__X509Certificate_PASSWORD") }}
{{- end }}
# StatefulSet (not Deployment) so each replica gets a stable ordinal hostname
# (sky-player-state-0/1/2). The task aggregate writer keys its cassandra rows on
# instanceId = Environment.MachineName; with a Deployment that was a fresh random
# pod name every rollout, so task_bucket_aggregates day partitions accumulated a new
# writer id per deploy and the merge-read eventually stalled. Stable ordinals bound the
# writer cardinality to replicaCount.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ .Chart.Name }}
  # StatefulSet RollingUpdate replaces one ordinal at a time in reverse order, which also
  # gives kafka a clean single-consumer handoff per pod instead of a surge of new members.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        security.coflnet.com/k8s-api-access: "false"
      annotations:
        {{ toYaml .Values.global.podAnnotations | nindent 8 }}
        {{- if $pkiPrepared }}
        security.coflnet.com/pki-revision: {{ .Values.pki.revision | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      {{- if $.Values.global.openbaoAuthPath }}
      automountServiceAccountToken: false
      {{- end }}
      imagePullSecrets:
      {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        {{- if or $.Values.global.openbaoAuthPath $pkiPrepared }}
        fsGroup: 1000
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        image: {{ .Values.image.repository }}:{{ .Values.image.tag  }}
        ports:
           {{ toYaml .Values.ports | nindent 10 }}
        env:
          {{- if $pkiPrepared }}
          {{- range $name, $value := .Values.pki.homeEnv }}
          - name: {{ $name }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          {{- if $pkiApplication }}
          {{- range $name, $value := .Values.pki.env }}
          - name: {{ $name }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          - name: OPENBAO__ENABLED
            value: "true"
          - name: OPENBAO__OPTIONAL
            value: {{ ternary "false" "true" (not (empty $.Values.global.openbaoAuthPath)) | quote }}
          - name: OPENBAO__ADDR
            value: {{ .Values.global.openbaoAddr | default "http://openbao.openbao.svc:8200" | quote }}
          - name: OPENBAO__CACERT
            value: /openbao/tls/ca.crt
          - name: OPENBAO__MOUNT
            value: kv
          - name: OPENBAO__PATH
            value: {{ printf "sky/%s" .Chart.Name | quote }}
          - name: OPENBAO__ROLE
            value: {{ .Chart.Name | quote }}
          {{- if $.Values.global.openbaoAuthPath }}
          - name: OPENBAO__AUTH_PATH
            value: {{ $.Values.global.openbaoAuthPath | quote }}
          - name: OPENBAO__TOKEN_PATH
            value: /var/run/secrets/openbao/token
          {{- if $.Values.global.openbaoTLSServerName }}
          - name: OPENBAO__TLS_SERVER_NAME
            value: {{ $.Values.global.openbaoTLSServerName | quote }}
          {{- end }}
          - name: OPENBAO__REQUEST_TIMEOUT_SECONDS
            value: "5"
          - name: OPENBAO__STARTUP_RETRY_SECONDS
            value: "90"
          - name: OPENBAO__RETRY_DELAY_SECONDS
            value: "2"
          {{- end }}
          {{ if .Values.envVars }}
          {{ include "coflnet.envVars" (dict "root" . "env" .Values.envVars "excludeNames" $legacyScyllaExclude) | nindent 10 }}
          {{ end }}
          {{ include "coflnet.envVars" (dict "root" . "env" .Values.global.envVars "pki" .Values.pki "excludeNames" (ternary (list "KAFKA__BROKERS" "KAFKA__USERNAME" "KAFKA__PASSWORD") (list) (not (empty $.Values.global.openbaoAuthPath)))) | nindent 10 }}
        readinessProbe:
          {{- if and .Values.pki.enabled .Values.pki.readinessEnabled }}
          {{ toYaml (mergeOverwrite (deepCopy .Values.readinessProbe) (dict "httpGet" (dict "path" "/health/ready" "port" "api"))) | nindent 10 }}
          {{- else }}
          {{ toYaml .Values.readinessProbe | nindent 10 }}
          {{- end }}
        resources:
          {{ toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        {{- if $pkiPrepared }}
        - {name: pki-client, mountPath: /pki/client, readOnly: true}
        - {name: pki-trust, mountPath: /pki/trust, readOnly: true}
        - {name: pki-home, mountPath: /tmp/pki-home}
        {{- end }}
        {{- if $.Values.global.openbaoAuthPath }}
        - name: openbao-workload-token
          mountPath: /var/run/secrets/openbao
          readOnly: true
        {{- end }}
        {{ range .Values.global.volumes }}
        - name: {{ .mountName }}
          mountPath: {{ .mountPath }}
        {{ end }}
        {{- if not $pkiApplication }}
        - name: scylla-pfx
          mountPath: /tls/scylla/secret/db.pfx
          subPath: db.pfx
        {{- end }}
      volumes:
      {{- if $pkiPrepared }}
        - name: pki-client
          secret: {secretName: sky-player-state-client, defaultMode: 0440}
        - name: pki-trust
          configMap: {name: sky-player-state-pki-trust}
        - name: pki-home
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
      {{- end }}
      {{- if $.Values.global.openbaoAuthPath }}
        - name: openbao-workload-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 600
                  path: token
      {{- end }}
        {{- if not $pkiApplication }}
        - name: scylla-pfx
          secret:
            secretName: scylla-pfx
            items:
            - key: db.pfx
              path: db.pfx
        {{- end }}
      {{ range .Values.global.volumes }}
        - name: {{ .mountName }}
          {{ if eq .type "configmap"  }}
          configMap:
            name: {{ .name }}
          {{ else}}
          secret:
            secretName: {{ .name }}
          {{ end }}
      {{ end }}
{{ end }}
