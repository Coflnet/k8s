enabled: true
replicaCount: 2

migration:
  enabled: false

# Activate only after all writers use the corrected-profit projection image.
profitMetrics:
  enabled: false
  coverageStartUtc: ""
  maximumRowsPerDay: 100000
  lookbackDays: 8

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyfliptracker
  tag: 402d9e85d40f5c155bc13483a90a74016c66daa6@sha256:e08f84fefe7b84f73ace87c0170a1181d0a848a6bf404efb146f428f779c8f36
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 350Mi
  limits:
    cpu: 800m
    memory: 1200Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 3
livenessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 150
  timeoutSeconds: 5
  periodSeconds: 6
  failureThreshold: 10
  successThreshold: 1

envVars:
  - name: REDIS_HOST
    value: "sky-global-redis"
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_tracker_database
  - name: CASSANDRA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: CASSANDRA__USER
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: tracker_user
  - name: CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: tracker_password
  - name: CASSANDRA__X509Certificate_PATHS
    value: /tls/scylla/secret/db.pfx
  - name: CASSANDRA__X509Certificate_PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: db-pfx-password
  - name: CASSANDRA__KEYSPACE
    value: "flips"
  - name: UNFOUND_FLIP_WEBHOOK
    valueFrom:
      secretKeyRef:
        name: secret
        key: unfound_flip_webhook

migrationEnvVars:
  # new scylla configuration
  - name: CASSANDRA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: CASSANDRA__USER
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: tracker_user
  - name: CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: tracker_password
  - name: CASSANDRA__X509Certificate_PATHS
    value: /tls/scylla/secret/db.pfx
  - name: CASSANDRA__X509Certificate_PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: db-pfx-password
  - name: CASSANDRA__KEYSPACE
    value: "flips"

  # old cassandra configuration
  - name: OLD_CASSANDRA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: config
        key: cassandra_host
  - name: OLD_CASSANDRA__USER
    valueFrom:
      configMapKeyRef:
        name: config
        key: cassandra_user
  - name: OLD_CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: secret
        key: cassandra_password
  - name: OLD_CASSANDRA__KEYSPACE
    value: "flips"
