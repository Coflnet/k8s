{{- if (.Values.pki | default dict).enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sky-crafts-certificates
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sky-crafts-certificates
rules:
- apiGroups: ['']
  resources: [serviceaccounts/token]
  resourceNames: [sky-crafts-certificates]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sky-crafts-certificates
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sky-crafts-certificates}
subjects:
- {kind: ServiceAccount, name: cert-manager, namespace: cert-manager}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sky-crafts-pki-trust
data:
  ca.crt: |
{{ required "pki.rootCaBundle is required" .Values.pki.rootCaBundle | indent 4 }}
{{- with .Values.pki.kafkaCaBundle | default .Values.global.kafkaCaBundle }}
  kafka-ca.crt: |
{{ . | indent 4 }}
{{- end }}
---
# Client leaf (Kafka/other mTLS clients).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: sky-crafts-client
spec:
  vault:
    server: https://openbao.openbao.svc:8200
    path: pki_int/sign/sky-crafts-client
    caBundle: {{ required "pki.listenerCaBundle is required" .Values.pki.listenerCaBundle | b64enc | quote }}
    auth:
      kubernetes:
        mountPath: /v1/auth/jwt-talos-eu
        role: cert-manager-issuer-sky-sky-crafts-client
        serviceAccountRef:
          name: sky-crafts-certificates
          audiences: ["vault://sky/sky-crafts-client"]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sky-crafts-client
spec:
  secretName: sky-crafts-client
  duration: 24h
  renewBefore: 8h
  privateKey: {algorithm: ECDSA, size: 384, rotationPolicy: Always}
  issuerRef: {name: sky-crafts-client, kind: Issuer}
  commonName: sky-crafts.sky.talos-eu.clients.coflnet.internal
  dnsNames: [sky-crafts.sky.talos-eu.clients.coflnet.internal]
  usages: [digital signature, client auth]
{{- end }}
