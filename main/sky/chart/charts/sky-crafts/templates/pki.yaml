{{- if (.Values.pki | default dict).enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sky-crafts-certificates
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sky-crafts-certificates
rules:
- apiGroups: ['']
  resources: [serviceaccounts/token]
  resourceNames: [sky-crafts-certificates]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sky-crafts-certificates
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sky-crafts-certificates}
subjects:
- {kind: ServiceAccount, name: cert-manager, namespace: cert-manager}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sky-crafts-pki-trust
data:
  ca.crt: |
{{ required "pki.rootCaBundle is required" .Values.pki.rootCaBundle | indent 4 }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: sky-crafts-server
spec:
  vault:
    server: https://openbao.openbao.svc:8200
    path: pki_int/sign/sky-crafts-server
    caBundle: {{ required "pki.listenerCaBundle is required" .Values.pki.listenerCaBundle | b64enc | quote }}
    auth:
      kubernetes:
        mountPath: /v1/auth/jwt-talos-eu
        role: cert-manager-issuer-sky-sky-crafts-server
        serviceAccountRef:
          name: sky-crafts-certificates
          audiences: ["vault://sky/sky-crafts-server"]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sky-crafts-server
spec:
  secretName: sky-crafts-server
  duration: 24h
  renewBefore: 8h
  privateKey: {algorithm: ECDSA, size: 384, rotationPolicy: Always}
  issuerRef: {name: sky-crafts-server, kind: Issuer}
  commonName: sky-crafts.sky.svc.cluster.local
  dnsNames: [sky-crafts, sky-crafts.sky, sky-crafts.sky.svc, sky-crafts.sky.svc.cluster.local]
  usages: [digital signature, server auth]
{{- if .Values.pki.applicationEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-crafts-https
spec:
  podSelector: {matchLabels: {app: sky-crafts}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values: [sky-api, sky-commands, sky-mod-commands, sky-bfcs]
    ports: [{protocol: TCP, port: 8443}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sky-crafts-https-clients
spec:
  endpointSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [sky-api, sky-commands, sky-mod-commands, sky-bfcs]
  egress:
  - toEndpoints:
    - matchLabels: {k8s:io.kubernetes.pod.namespace: sky, app: sky-crafts}
    toPorts:
    - ports: [{port: '8443', protocol: TCP}]
{{- end }}
{{- end }}
