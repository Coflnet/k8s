enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skycrafts
  tag: 7c824b7f8ce4702872f2e3a5f0532f45e1e937e0@sha256:db57e1bd6e0a2f11aa5963862ae0de488ea9e9eae5faad6f41d769b1202d7020
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    memory: 768Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /crafts/ready
    port: api
  initialDelaySeconds: 120
  periodSeconds: 5

pki:
  enabled: false
  applicationEnabled: false

# sky-crafts has no Kafka client: skip the shared redpanda volumes and all KAFKA* entries
# from global.envVars. Set to true only if the app gains a Kafka client.
kafka:
  enabled: false
