enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skycrafts
  tag: df9f3c0f150f428632f45d0daa479e57b53f3ffc@sha256:f53fcddc23c0bff894112f3d99e53c261f55c3721568ad5ec4d8a3519355d303
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    memory: 768Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /crafts/ready
    port: api
  initialDelaySeconds: 120
  periodSeconds: 5

pki:
  enabled: false
  applicationEnabled: false
