enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skycrafts
  tag: 4fecce65b7b2eacfe2de9e06ed15f2ef8de5545d@sha256:622cbfadcd9e1bd4543437017ef0660c6b04c064303c6b1a2e53c662bba57265
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    memory: 768Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /crafts/ready
    port: api
  initialDelaySeconds: 120
  periodSeconds: 5

pki:
  enabled: false
  applicationEnabled: false

# sky-crafts has no Kafka client: skip the shared redpanda volumes and all KAFKA* entries
# from global.envVars. Set to true only if the app gains a Kafka client.
kafka:
  enabled: false
