enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skycrafts
  tag: 89abe8c5b121e9610f55e16961be82a39fdd0e9f@sha256:4ccc1dbac7023c27206997fc853fd92ad1a9b5a2e8f5c9102e0f4464e3767323
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    memory: 768Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /crafts/ready
    port: api
  initialDelaySeconds: 120
  periodSeconds: 5

pki:
  enabled: false
  applicationEnabled: false
