enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skycrafts
  tag: 76abc5ec517fa741b4d71a2db0d51ab175980606@sha256:893667863bfce4a40315218f763ca2a000a389eacca905b9692528fbdcee4a19
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    memory: 768Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /crafts/ready
    port: api
  initialDelaySeconds: 120
  periodSeconds: 5

pki:
  enabled: false
  applicationEnabled: false

# sky-crafts has no Kafka client: skip the shared redpanda volumes and all KAFKA* entries
# from global.envVars. Set to true only if the app gains a Kafka client.
kafka:
  enabled: false
