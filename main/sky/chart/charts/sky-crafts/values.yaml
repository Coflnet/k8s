enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skycrafts
  tag: ebcedac111e9713c5324883e665bf5e4ee15d354@sha256:8ef01910407e57e84ff826bc48484ee4a589492bffc457d09c7016883f10b9db
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    memory: 768Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /crafts/ready
    port: api
  initialDelaySeconds: 120
  periodSeconds: 5

pki:
  enabled: false
  applicationEnabled: false

# sky-crafts has no Kafka client: skip the shared redpanda volumes and all KAFKA* entries
# from global.envVars. Set to true only if the app gains a Kafka client.
kafka:
  enabled: false
