enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skycrafts
  tag: e65475020b70fb92b5ee3d076f09ce5e7cfb4d01@sha256:475d70556f105bb42b5ad58859faeafb06e6c33d329fa41650dcfdbd01369135
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 200Mi
  limits:
    memory: 768Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /crafts/ready
    port: api
  initialDelaySeconds: 120
  periodSeconds: 5

pki:
  enabled: false
  applicationEnabled: false

# sky-crafts has no Kafka client: skip the shared redpanda volumes and all KAFKA* entries
# from global.envVars. Set to true only if the app gains a Kafka client.
kafka:
  enabled: false
