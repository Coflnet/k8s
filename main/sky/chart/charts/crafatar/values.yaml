enabled: true

replicaCount: 2
revisionHistoryLimit: 5

image:
  repository: muehlhansfl/crafatar
  tag: c923cf0a98cd66f8e222c0da56ab79e81c3c9f71@sha256:ccf103e2be8e488a1d543aa466d1e7e7660ef551fd5cb43e0f54cee0266de42b
  pullPolicy: IfNotPresent

ports:
  - name: web
    containerPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 200Mi

serivcePorts:
  - name: web
    port: 3000
    targetPort: 3000

readinessProbe:
  httpGet:
    path: /
    port: web
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 6
  timeoutSeconds: 5

envVars:
  - name: REDIS_URL
    value: "redis://redis-service"
  - name: CACHE_LOCAL
    value: "36000"
  - name: CACHE_BROWSER
    value: "86000"
  - name: EPHEMERAL_STORAGE
    value: "false"
ingress:
  enabled: false
  host: sky.coflnet.com
  # TLS is managed upstream (Cloudflare); no TLS settings here

