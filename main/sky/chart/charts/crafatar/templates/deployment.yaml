{{ if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 2592000
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        {{ toYaml .Values.global.podAnnotations | nindent 8 }}
    spec:
      imagePullSecrets:
      {{ toYaml .Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        image: {{ .Values.image.repository }}:{{ .Values.image.tag  }}
        ports:
           {{ toYaml .Values.ports | nindent 10 }}
        {{- $kafkaOff := eq ((.Values.kafka | default dict).enabled | toString) "false" }}
        env:
          {{ if .Values.envVars }}
          {{ toYaml .Values.envVars | nindent 10 }}
          {{ end }}
          {{- $excludeEnv := list }}
          {{- if $kafkaOff }}
          {{- range .Values.global.envVars }}{{ if hasPrefix "KAFKA" .name }}{{ $excludeEnv = append $excludeEnv .name }}{{ end }}{{ end }}
          {{- end }}
          {{ include "coflnet.envVars" (dict "root" . "env" .Values.global.envVars "excludeNames" $excludeEnv) | nindent 10 }}
        readinessProbe:
          {{ toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{ toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        {{ range .Values.global.volumes }}
        {{- if not (and $kafkaOff (eq .name "redpanda")) }}
        - name: {{ .mountName }}
          mountPath: {{ .mountPath }}
        {{- end }}
        {{ end }}
        # crafatar caches downloaded images to ./images/* relative to its
        # workdir (/home/app/crafatar); with a read-only root filesystem these
        # writes fail with EACCES. Mount a writable emptyDir per subdirectory
        # (subPath lets kubelet create each dir, which the app itself does not).
        {{ range $dir := list "skins" "faces" "helms" "renders" "capes" }}
        - name: images-cache
          mountPath: /home/app/crafatar/images/{{ $dir }}
          subPath: {{ $dir }}
        {{ end }}
        - name: tmp
          mountPath: /tmp
      volumes:
      {{ range .Values.global.volumes }}
      {{- if not (and $kafkaOff (eq .name "redpanda")) }}
        - name: {{ .mountName }}
          {{ if eq .type "configmap"  }}
          configMap:
            name: {{ .name }}
          {{ else}}
          secret:
            secretName: {{ .name }}
          {{ end }}
      {{- end }}
      {{ end }}
        - name: images-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{ end }}
