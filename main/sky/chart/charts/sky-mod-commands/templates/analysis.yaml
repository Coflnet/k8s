{{ if .Values.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Chart.Name }}
spec:
  args:
  - name: service-name
  - name: latest-hash
  metrics:
  - name: sky-sent_flips
    interval: 3m
    successCondition: result[0] >= 1
    failureLimit: 1
    count: 3
    provider:
      prometheus:
        address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        query: |
          sum(increase(sky_mod_sent_flips{namespace="{{ .Release.Namespace }}",pod=~"{{ .Chart.Name }}-{{ "{{args.latest-hash}}" }}-.*"}[5m]))
{{ end }}
