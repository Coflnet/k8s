enabled: true
replicaCount: 1

strategy: Recreate

image:
  repository: muehlhansfl/skyindexer
  tag: 552a2b6f2a9e96e07a5bff3effe2d2ca1a7ee986@sha256:15e1cdbd6a539a03641f338e1cf705b3d6fc1b43f0d0d1f86d60f07cdbc94259
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 550Mi
  limits:
    cpu: 500m
    memory: 700Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        key: connection_live
        name: secret
  - name: SKYCOMMANDS_HOST
    valueFrom:
      configMapKeyRef:
        name: config
        key: commands_host
  # Auction archive (SkyIndexer README "Auction archive"), everything off by default.
  # Flip order per cluster overlay: S3__* + ARCHIVE__ENABLED=true (archive only, no
  # deletion) -> verify blobs, archived_months and sky_indexer_archive_* metrics ->
  # ARCHIVE__DELETE_MARIADB=true -> OPTIMIZE TABLE by an operator.
  - name: S3__ENABLED
    value: "false"
  - name: ARCHIVE__ENABLED
    value: "false"
  - name: ARCHIVE__DELETE_MARIADB
    value: "false"
