enabled: true
replicaCount: 1

strategy: Recreate

image:
  repository: muehlhansfl/skyindexer
  tag: 0b78d977306bb2a381a70100976d75983f6472e6@sha256:b8c343db80692aabc9492e0da87ae8f0a854f99790de654f2e844ac2afee8492
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 550Mi
  limits:
    cpu: 500m
    memory: 700Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        key: connection_live
        name: secret
  - name: SKYCOMMANDS_HOST
    valueFrom:
      configMapKeyRef:
        name: config
        key: commands_host
  # Auction archive (SkyIndexer README "Auction archive"), everything off by default.
  # Flip order per cluster overlay: S3__* + ARCHIVE__ENABLED=true (archive only, no
  # deletion) -> verify blobs, archived_months and sky_indexer_archive_* metrics ->
  # ARCHIVE__DELETE_MARIADB=true -> OPTIMIZE TABLE by an operator.
  - name: S3__ENABLED
    value: "false"
  - name: ARCHIVE__ENABLED
    value: "false"
  - name: ARCHIVE__DELETE_MARIADB
    value: "false"

# EU-only external SQL issuance is independent of application use.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
