enabled: true
replicaCount: 1

strategy: Recreate

image:
  repository: muehlhansfl/skyindexer
  tag: 915d0c4230eedb48af46fa41f2d1d7cf6fc93863@sha256:79058d91f674f91b6f4dfc49d27cd7c0c82cfe4b3fb99d68c907ac0318959e95
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 550Mi
  limits:
    cpu: 500m
    memory: 700Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        key: connection_live
        name: secret
  - name: SKYCOMMANDS_HOST
    valueFrom:
      configMapKeyRef:
        name: config
        key: commands_host
  # Auction archive (SkyIndexer README "Auction archive"), everything off by default.
  # Flip order per cluster overlay: S3__* + ARCHIVE__ENABLED=true (archive only, no
  # deletion) -> verify blobs, archived_months and sky_indexer_archive_* metrics ->
  # ARCHIVE__DELETE_MARIADB=true -> OPTIMIZE TABLE by an operator.
  - name: S3__ENABLED
    value: "false"
  - name: ARCHIVE__ENABLED
    value: "false"
  - name: ARCHIVE__DELETE_MARIADB
    value: "false"
