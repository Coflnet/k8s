enabled: true
replicaCount: 1

strategy: Recreate

image:
  repository: muehlhansfl/skyindexer
  tag: ca6891088d999d8c5d526bc4b64f9113e680e1ce@sha256:178eb0c0b9964d66a9810dc91cb7322e2a33e82b6c2e2903882ea0964e5a98e8
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 550Mi
  limits:
    cpu: 500m
    memory: 700Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        key: connection_live
        name: secret
  - name: SKYCOMMANDS_HOST
    valueFrom:
      configMapKeyRef:
        name: config
        key: commands_host
