{{ if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public traffic enters through the Envoy Gateway public-tunnel proxy only (HTTPRoutes sky-coflnet
    # and sky-commands-coflnet in fleet gateway-api/ane/sky-main.yaml). Fleet carries the same allow as
    # CiliumNetworkPolicy sky-web-frontends-allow-public-tunnel-gateway; policies are additive.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.coflnet.com/public-proxy: "true"
      ports:
        - protocol: TCP
          port: 3000
    # Not listed on purpose: kubelet probes (Cilium always admits the local host), the CI knowledge-refresh
    # version poll (fleet CiliumNetworkPolicy eu-sky-hypixel-react-version-check). Nothing else calls this app.
  egress:
    # DNS resolution (kube-dns / CoreDNS)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # sky-api (API_ENDPOINT)
    - to:
        - podSelector:
            matchLabels:
              app: sky-api
      ports:
        - protocol: TCP
          port: 8000
    # sky-commands (COMMAND_ENDPOINT)
    - to:
        - podSelector:
            matchLabels:
              app: sky-commands
      ports:
        - protocol: TCP
          port: 8008
    # No external internet access needed — all SSR calls use in-cluster services
{{ end }}
