enabled: true

replicaCount: 3
revisionHistoryLimit: 5

image:
  repository: muehlhansfl/hypixel-react
  tag: db08ee8676a6c344179231252b69ee0d104469a2@sha256:26dc5dd63efc6a61161c561f7c50d416665585f1b5ec7791e19307bb0e915fcb
  pullPolicy: IfNotPresent

ports:
  - name: web
    containerPort: 3000

# Observed 7d max working set 1.35 GB per pod (Prometheus, 2026-10-23); limit is about 2x.
# No CPU limit: peak was 0.47 core per pod and a limit would only throttle SSR latency.
resources:
  requests:
    cpu: 150m
    memory: 500Mi
  limits:
    memory: 2800Mi

# The image is distroless/nonroot. Next writes ISR output into .next/server/app and its fetch cache
# into .next/cache; both are emptyDirs (server is seeded from the image by an init container).
readOnlyRootFilesystem: true

pdb:
  enabled: true
  maxUnavailable: 1

serivcePorts:
  - name: web
    port: 3000
    targetPort: 3000

# Readiness renders the home page end to end (SSR plus sky-api), so a backend outage takes the pod out of
# the Service. Liveness and startup must not depend on backends: /api/version is a force-dynamic route that
# only returns APP_VERSION, answers 200 solely for the Host below (the internal Service name) and otherwise 404.
readinessProbe:
  httpGet:
    path: /
    port: web
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 6
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /api/version
    port: web
    httpHeaders:
      - name: Host
        value: hypixel-react.sky.svc.cluster.local
  periodSeconds: 2
  failureThreshold: 30
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /api/version
    port: web
    httpHeaders:
      - name: Host
        value: hypixel-react.sky.svc.cluster.local
  periodSeconds: 10
  failureThreshold: 6
  timeoutSeconds: 5

envVars:
  - name: COMMAND_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: config
        key: frontend_command_endpoint
  - name: API_ENDPOINT
    valueFrom:
      configMapKeyRef:
        name: config
        key: frontend_api_endpoint

ingress:
  enabled: false
  nginx: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
