enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyreferral
  tag: 4a9c2c870896b79d034e79bb2cac7d50a83248be@sha256:bb200566f78d05a7b083ebcec8f3c5a4e3d0dac96072b7b3bb39b37c1780cfb5
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 10m
    memory: 200Mi
  limits:
    cpu: 250m
    memory: 512Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_micro_referral
  - name: PRODUCTS__REFERAL_BONUS
    value: "referal_bonus"
  - name: PRODUCTS__VERIFY_MC
    value: "verify_mc"
  - name: TOPICS__TRANSACTION
    value: sky-transactions

# EU external SQL identity issuance and application use are separate phases.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
