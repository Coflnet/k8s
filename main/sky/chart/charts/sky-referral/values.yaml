enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyreferral
  tag: fe39be05545e02a1233d97d4f4834e2912db3b40@sha256:bba8bb0ee1334a51ce744af59cdcd0db37837507ce1b9c6d7efba3efa7b46f18
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 10m
    memory: 200Mi
  limits:
    cpu: 250m
    memory: 512Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_micro_referral
  - name: PRODUCTS__REFERAL_BONUS
    value: "referal_bonus"
  - name: PRODUCTS__VERIFY_MC
    value: "verify_mc"
  - name: TOPICS__TRANSACTION
    value: sky-transactions

# EU external SQL identity issuance and application use are separate phases.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
