enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyreferral
  tag: fc2837187177fc282559ee33647b93c947615d28@sha256:1dee081ca0d24b3729bdca5e99c4746d207b77f30ca9f60710259f4b19be10f6
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 10m
    memory: 200Mi
  limits:
    cpu: 250m
    memory: 512Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_micro_referral
  - name: PRODUCTS__REFERAL_BONUS
    value: "referal_bonus"
  - name: PRODUCTS__VERIFY_MC
    value: "verify_mc"
  - name: TOPICS__TRANSACTION
    value: sky-transactions

# EU external SQL identity issuance and application use are separate phases.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
