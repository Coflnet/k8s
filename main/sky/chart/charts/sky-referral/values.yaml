enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyreferral
  tag: f856d2af955eed79902a29bb0c625f68d2204cdc@sha256:308719d32b9efd79e9d4a3672d2d3b96ec7f2a4804db25d237f0ed56b8830932
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 10m
    memory: 200Mi
  limits:
    cpu: 250m
    memory: 512Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_micro_referral
  - name: PRODUCTS__REFERAL_BONUS
    value: "referal_bonus"
  - name: PRODUCTS__VERIFY_MC
    value: "verify_mc"
  - name: TOPICS__TRANSACTION
    value: sky-transactions

# EU external SQL identity issuance and application use are separate phases.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
