{{- if (.Values.pki | default dict).enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sky-player-name-certificates
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sky-player-name-certificates
rules:
- apiGroups: ['']
  resources: [serviceaccounts/token]
  resourceNames: [sky-player-name-certificates]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sky-player-name-certificates
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sky-player-name-certificates}
subjects:
- {kind: ServiceAccount, name: cert-manager, namespace: cert-manager}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sky-player-name-pki-trust
data:
  ca.crt: |
{{ required "pki.rootCaBundle is required" .Values.pki.rootCaBundle | indent 4 }}
{{- range .Values.pki.certificates }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .name }}
spec:
  vault:
    server: https://openbao.openbao.svc:8200
    path: pki_int/sign/{{ .name }}
    caBundle: {{ required "pki.listenerCaBundle is required" $.Values.pki.listenerCaBundle | b64enc | quote }}
    auth:
      kubernetes:
        mountPath: /v1/auth/jwt-talos-eu
        role: cert-manager-issuer-sky-{{ .name }}
        serviceAccountRef:
          name: sky-player-name-certificates
          audiences: [{{ printf "vault://sky/%s" .name | quote }}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
spec:
  secretName: {{ .name }}
  duration: 24h
  renewBefore: 8h
  privateKey: {algorithm: ECDSA, size: 384, rotationPolicy: Always}
  issuerRef: {name: {{ .name }}, kind: Issuer}
  commonName: {{ .commonName }}
  dnsNames:
{{ toYaml .dnsNames | indent 2 }}
  usages: {{ toJson .usages }}
{{- end }}
{{- if .Values.pki.applicationEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-player-name-https
spec:
  podSelector: {matchLabels: {app: sky-player-name}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [sky, ctw]
    ports: [{protocol: TCP, port: 8443}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sky-player-name-https-clients
spec:
  endpointSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [sky-api, sky-commands, sky-mod-commands, sky-bfcs]
  egress:
  - toEndpoints:
    - matchLabels: {k8s:io.kubernetes.pod.namespace: sky, app: sky-player-name}
    toPorts:
    - ports: [{port: '8443', protocol: TCP}]
{{- end }}
{{- end }}
