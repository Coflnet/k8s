enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyplayername
  tag: d6dd8f51c17dafd44da4f5c7f483f8833210abce@sha256:1a8013199d002ebe8ad1bcc79778532334d6c71fa61af98749151740931e0b8d
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 80m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_read_secondary
