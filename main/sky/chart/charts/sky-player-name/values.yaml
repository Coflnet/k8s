enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyplayername
  tag: 80f67e59dda2f9b035aae4a31ada29051dc2458e@sha256:d9ef0a12a0cc29907e375641c1e7e44341645cb1854fbe41efd4a357f281004d
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 80m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_read_secondary
