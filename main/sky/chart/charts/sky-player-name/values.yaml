enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyplayername
  tag: 98017b74ac25f17e7f82efe4ed0a8b1340be5050@sha256:8ccf5fd29144c31034cc13fb1c12f27e79ed2aa6f1358943e561226ba9771a7c
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 80m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_read_secondary
