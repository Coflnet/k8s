enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyplayername
  tag: 363b5fbc8be0dc334c90f85a1fc75a3c028da820@sha256:2a978614d32632e627b1bb890a2f8d88a85bf8930b5dbc09ba2c8b86372c85ca
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 80m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_read_secondary
