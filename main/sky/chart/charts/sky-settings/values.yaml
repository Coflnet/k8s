enabled: true
replicaCount: 3

serviceMonitor:
  enabled: false

strategy: RollingUpdate

image:
  repository: muehlhansfl/skysettings
  tag: 8e71d4c3c8d1971ab95ebd55c36ad9e524e871c7@sha256:cc767b89649794c6a0fb682d71c5a4134e81832d733f23bfc7c2658ef51eb3a6
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

migration:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 400Mi
  limits:
    memory: 800Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: sky_settings_database
  - name: CASSANDRA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: CASSANDRA__KEYSPACE
    value: "settings"
  - name: CASSANDRA__USER
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_settings_user
  - name: CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: settings_password
  - name: CASSANDRA__X509Certificate_PATHS
    value: /tls/scylla/secret/db.pfx
  - name: CASSANDRA__X509Certificate_PASSWORD
    valueFrom:
      secretKeyRef:
        name: scylla-credentials
        key: db-pfx-password


  - name: OLD_CASSANDRA__HOSTS
    value: "38.242.247.61"
  - name: OLD_CASSANDRA__USER
    valueFrom:
      configMapKeyRef:
        name: config
        key: cassandra_user
  - name: OLD_CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: secret
        key: cassandra_password
  - name: OLD_CASSANDRA__KEYSPACE
    value: settings

# Certificate issuance and application activation are separate EU-only phases.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
