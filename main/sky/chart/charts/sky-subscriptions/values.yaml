enabled: true
replicaCount: 1

strategy: Recreate

image:
  repository: muehlhansfl/skysubscriptions
  tag: 8575e3c6841dccd951438fb8134609c91ba70410@sha256:c1fa79f98a9361ca7e4886bb856a381042e31837c89b0b6a5b464fe1feeaa81b
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 500Mi
  limits:
    cpu: 600m
    memory: 1024Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_micro_subscriptions
  - name: DBConnection
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_read_secondary
  - name: FIREBASE_SENDER_ID
    valueFrom:
      secretKeyRef:
        name: secret
        key: firebase_sender_id
  - name: FIREBASE_KEY
    valueFrom:
      secretKeyRef:
        name: secret
        key: firebase_key

# External SQL issuance is separate from application activation.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
