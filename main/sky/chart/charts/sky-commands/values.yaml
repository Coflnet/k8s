enabled: true
replicaCount: 3

image:
  repository: muehlhansfl/skycommands
  tag: f6ef3d3a1881143983864d4a2907879c3f6eaf9b@sha256:8e3f12cb3f574030b4cf6f3fa7dedf5be10f1335f61b1a68e3ce11fa8cab4fe7
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

imgproxy:
  replicaCount: 1

ports:
  - name: websocket
    containerPort: 8000
  - name: api
    containerPort: 8008

resources:
  requests:
    memory: 2.5Gi
    cpu: 400m
  limits:
    memory: 4Gi
    cpu: 1200m

diagnostics:
  enabled: true
  image:
    repository: mcr.microsoft.com/dotnet/monitor
    tag: "10.0.3@sha256:f4d9709b09339162d07604068bd7159661bd899cd22fcbabad856d979076d2a5"
    pullPolicy: IfNotPresent
  workingSetThresholdMb: 3300
  artifactsSizeLimit: 7Gi
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      # the gcdump graph is built inside dotnet-monitor
      memory: 1Gi

services:
  - sky-commands
  - sky-commands-canary-service
  - sky-commands-stable-service

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000
  - name: websocket
    port: 8008
    targetPort: 8008

template: &canaryTemplate sky-commands
canaryService: &canaryService sky-commands-canary-service
stableService: &stableService sky-commands-stable-service
mainService: &mainService sky-commands
trafficSplit: &trafficSplit sky-commands
canary:
  steps:
    - setWeight: 10
    - pause:
        duration: 3m
    - analysis:
        templates:
          - templateName: *canaryTemplate
        args:
          - name: service-name
            value: *canaryService
    - setWeight: 50
    - pause:
        duration: 5m
    - analysis:
        templates:
          - templateName: *canaryTemplate
        args:
          - name: service-name
            value: *canaryService
    - setWeight: 100
    - pause:
        duration: 5m
    - analysis:
        templates:
          - templateName: *canaryTemplate
        args:
          - name: service-name
            value: *canaryService
  maxUnavailable: 1
  canaryService: *canaryService
  stableService: *stableService
  trafficRouting:
    smi:
      rootService: *mainService
      trafficSplitName: *trafficSplit

readinessProbe:
  httpGet:
    path: /metrics
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 3
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /metrics
    port: 8000
  initialDelaySeconds: 30
  failureThreshold: 10
  timeoutSeconds: 5
  periodSeconds: 10
envVars: []

ingress:
  enabled: false
  nginx: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

pki:
  enabled: false
  applicationEnabled: false
