enabled: true
replicaCount: 3

image:
  repository: muehlhansfl/skycommands
  tag: 6c34c974538341f107e6cad198b5277a6fa8f0e1@sha256:259d1f41b207ac80a759ec0a5b2e86f8b09caa5b7e3acc853a80c15a649d42ea
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

imgproxy:
  replicaCount: 1

ports:
  - name: websocket
    containerPort: 8000
  - name: api
    containerPort: 8008

resources:
  requests:
    memory: 2.5Gi
    cpu: 400m
  limits:
    memory: 4Gi
    cpu: 1200m

diagnostics:
  enabled: true
  image:
    repository: mcr.microsoft.com/dotnet/monitor
    tag: "10.0.3@sha256:f4d9709b09339162d07604068bd7159661bd899cd22fcbabad856d979076d2a5"
    pullPolicy: IfNotPresent
  workingSetThresholdMb: 3300
  artifactsSizeLimit: 7Gi
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi

services:
  - sky-commands
  - sky-commands-canary-service
  - sky-commands-stable-service

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000
  - name: websocket
    port: 8008
    targetPort: 8008

template: &canaryTemplate sky-commands
canaryService: &canaryService sky-commands-canary-service
stableService: &stableService sky-commands-stable-service
mainService: &mainService sky-commands
trafficSplit: &trafficSplit sky-commands
canary:
  steps:
    - setWeight: 10
    - pause:
        duration: 3m
    - analysis:
        templates:
          - templateName: *canaryTemplate
        args:
          - name: service-name
            value: *canaryService
    - setWeight: 50
    - pause:
        duration: 5m
    - analysis:
        templates:
          - templateName: *canaryTemplate
        args:
          - name: service-name
            value: *canaryService
    - setWeight: 100
    - pause:
        duration: 5m
    - analysis:
        templates:
          - templateName: *canaryTemplate
        args:
          - name: service-name
            value: *canaryService
  maxUnavailable: 1
  canaryService: *canaryService
  stableService: *stableService
  trafficRouting:
    smi:
      rootService: *mainService
      trafficSplitName: *trafficSplit

readinessProbe:
  httpGet:
    path: /metrics
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 3
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /metrics
    port: 8000
  initialDelaySeconds: 30
  failureThreshold: 10
  timeoutSeconds: 5
  periodSeconds: 10
envVars: []

ingress:
  enabled: false
  nginx: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
