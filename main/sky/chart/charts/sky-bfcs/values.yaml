enabled: true
defaultEnvVarsEnabled: true
replicaCount: 1
openbaoOptional: true

strategy: RollingUpdate

image:
  repository: muehlhansfl/skybfcs
  tag: 1b0e30087738546c4772573ea3ed46036b4845c9@sha256:039b5308aa68ac0fc1bdd7433b4028fa4563cb1db1475038e46ebd700a8a4e68
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000
  - name: websocket
    containerPort: 8888

resources:
  requests:
    cpu: 1400m
    memory: 3Gi
  limits:
    memory: 9Gi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000
  - name: websocket
    port: 8888
    targetPort: 8888

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 10
livenessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 600
  periodSeconds: 5
  failureThreshold: 40
  timeoutSeconds: 2

envVars:
  - name: SNIPER_TRANSFER_TOKEN
    valueFrom:
      secretKeyRef:
        name: sniper-transfer-token
        key: sniper_transfer_token
  - name: SLOWDOWN_MS
    value: "200"

metrics:
  enabled: true

ingress:
  enabled: false
  host: ""
  tls:
    enabled: false


redis:
  enabled: true

externalMinio: false
