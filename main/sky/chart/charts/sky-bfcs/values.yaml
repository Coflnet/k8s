enabled: true
defaultEnvVarsEnabled: true
replicaCount: 1
openbaoOptional: true

strategy: RollingUpdate

image:
  repository: muehlhansfl/skybfcs
  tag: 9e64873b4ad9794fbfe59ec0d2f6e52244367fa1@sha256:2bc883b5c4689ace67307e977fa1381d1abcdd28921bff57266f8cb1f06a3149
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000
  - name: websocket
    containerPort: 8888

resources:
  requests:
    cpu: 1400m
    memory: 3Gi
  limits:
    memory: 9Gi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000
  - name: websocket
    port: 8888
    targetPort: 8888

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 10
livenessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 600
  periodSeconds: 5
  failureThreshold: 40
  timeoutSeconds: 2

envVars:
  - name: SNIPER_TRANSFER_TOKEN
    valueFrom:
      secretKeyRef:
        name: sniper-transfer-token
        key: sniper_transfer_token
  - name: SLOWDOWN_MS
    value: "200"

metrics:
  enabled: true

ingress:
  enabled: false
  host: ""
  tls:
    enabled: false


redis:
  enabled: true

externalMinio: false
