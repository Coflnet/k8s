enabled: true
defaultEnvVarsEnabled: true
replicaCount: 1
openbaoOptional: true

strategy: RollingUpdate

image:
  repository: muehlhansfl/skybfcs
  tag: 1d623ae7b1a9f5cfa0b1998a3aab662b5c696978@sha256:eab4f13ee23d3d9c6bc297d7d32ce758cc61ca7dafbcd86505bd7737ed1d281f
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000
  - name: websocket
    containerPort: 8888

resources:
  requests:
    cpu: 1400m
    memory: 3Gi
  limits:
    memory: 9Gi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000
  - name: websocket
    port: 8888
    targetPort: 8888

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 10
livenessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 600
  periodSeconds: 5
  failureThreshold: 40
  timeoutSeconds: 2

envVars:
  - name: SNIPER_TRANSFER_TOKEN
    valueFrom:
      secretKeyRef:
        name: sniper-transfer-token
        key: sniper_transfer_token
  - name: SLOWDOWN_MS
    value: "200"

metrics:
  enabled: true

ingress:
  enabled: false
  host: ""
  tls:
    enabled: false


redis:
  enabled: true

externalMinio: false
