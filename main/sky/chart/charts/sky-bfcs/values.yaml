enabled: true
defaultEnvVarsEnabled: true
replicaCount: 1
openbaoOptional: true

strategy: RollingUpdate

image:
  repository: muehlhansfl/skybfcs
  tag: af38e33a2b95e7b1abf231b55c8a3d1a46c639a3@sha256:9a8b1b2b2a142af621940bd36a6595ba22015d9f4a8f4e2133bb545bfd013955
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000
  - name: websocket
    containerPort: 8888

resources:
  requests:
    cpu: 1400m
    memory: 3Gi
  limits:
    memory: 9Gi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000
  - name: websocket
    port: 8888
    targetPort: 8888

readinessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 10
  periodSeconds: 3
  failureThreshold: 10
livenessProbe:
  httpGet:
    path: /ready
    port: api
  initialDelaySeconds: 600
  periodSeconds: 5
  failureThreshold: 40
  timeoutSeconds: 2

envVars:
  - name: SNIPER_TRANSFER_TOKEN
    valueFrom:
      secretKeyRef:
        name: sniper-transfer-token
        key: sniper_transfer_token
  - name: SLOWDOWN_MS
    value: "200"

metrics:
  enabled: true

ingress:
  enabled: false
  host: ""
  tls:
    enabled: false


redis:
  enabled: true

externalMinio: false
