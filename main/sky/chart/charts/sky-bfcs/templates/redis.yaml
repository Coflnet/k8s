{{ if .Values.enabled }}
{{ if .Values.redis.enabled }}
{{- $name := printf "%s-redis" .Chart.Name }}
{{- $tlsConfig := (.Values.global | default dict).redisOptionalTls | default dict }}
{{- $optionalTls := and $tlsConfig.enabled $tlsConfig.listenersEnabled (has $name (dig "listenerServices" ($tlsConfig.services | default list) $tlsConfig)) }}
{{- $tls := .Values.redis.tls }}
{{- if and $optionalTls $tls.enabled }}{{ fail "optional TLS cannot override existing BFCS TLS-only mode" }}{{ end }}
{{- $acl := .Values.redis.acl }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-redis
  labels:
    app: {{ .Chart.Name }}-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-redis
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-redis
    spec:
      automountServiceAccountToken: false
      {{- if $optionalTls }}
      securityContext:
        fsGroup: 999
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}-redis
        image: redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          # redis snapshots to its default dir /data, mounted as an emptyDir below.
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        args:
          {{- if $optionalTls }}
          {{- include "coflnet.redisOptionalTls.args" . | nindent 10 }}
          {{- end }}
          {{- if $tls.enabled }}
          - --port
          - "0"
          - --tls-port
          - "6379"
          - --tls-cert-file
          - /tls/tls.crt
          - --tls-key-file
          - /tls/tls.key
          - --tls-ca-cert-file
          - /tls-ca/tls.crt
          - --tls-auth-clients
          - "yes"
          {{- else if .Values.redis.passwordSecret }}
          # Kubernetes expands $(VAR) in args from the container's own env, so the
          # password reaches redis-server without ever being written to Git.
          - --requirepass
          - $(REDIS_PASSWORD)
          {{- else if .Values.redis.password }}
          - --requirepass
          - {{ .Values.redis.password | quote }}
          {{- end }}
          {{- if $acl.enabled }}
          - --aclfile
          - /acl/acl.conf
          {{- end }}
        {{- if .Values.redis.passwordSecret }}
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.passwordSecret.name }}
              key: {{ .Values.redis.passwordSecret.key | default "password" }}
        {{- end }}
        ports:
        - containerPort: 6379
        resources:
          # 7d max working set 15Mi (2026-10-25).
          limits:
            memory: "256Mi"
          requests:
            memory: "64Mi"
            cpu: "50m"
        volumeMounts:
        - name: data
          mountPath: /data
        {{- if $tls.enabled }}
        - name: redis-tls
          mountPath: /tls
          readOnly: true
        - name: redis-intermediate-ca
          mountPath: /tls-ca
          readOnly: true
        {{- end }}
        {{- if $acl.enabled }}
        - name: redis-acl
          mountPath: /acl
          readOnly: true
        {{- end }}
        {{- if $optionalTls }}
        {{- include "coflnet.redisOptionalTls.mount" . | nindent 8 }}
        {{- end }}
      {{- if $optionalTls }}
      {{- include "coflnet.redisOptionalTls.reloader" (dict "passwordSecret" .Values.redis.passwordSecret "serverName" (printf "%s.%s.svc.cluster.local" $name $.Release.Namespace)) | nindent 6 }}
      {{- end }}
      volumes:
      {{- if $optionalTls }}
      {{- include "coflnet.redisOptionalTls.volume" (dict "name" $name "config" $tlsConfig) | nindent 6 }}
      {{- end }}
      - name: data
        emptyDir: {}
      {{- if $tls.enabled }}
      - name: redis-tls
        secret:
          secretName: redis-tls
      - name: redis-intermediate-ca
        secret:
          secretName: redis-intermediate-ca
      {{- end }}
      {{- if $acl.enabled }}
      - name: redis-acl
        secret:
          secretName: {{ $acl.configSecret | default "redis-acl" }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-redis
  labels:
    mirror.linkerd.io/exported: "true"
spec:
  type: {{ .Values.redis.serviceType | default "ClusterIP" }}
  {{- if eq (.Values.redis.serviceType | default "ClusterIP") "NodePort" }}
  # Keep the original peer address for the reviewed cross-cluster ingress rules.
  externalTrafficPolicy: Local
  {{- end }}
  selector:
    app: {{ .Chart.Name }}-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
      {{- if .Values.redis.nodePort }}
      nodePort: {{ .Values.redis.nodePort }}
      {{- end }}
{{ end }}
{{ end }}
