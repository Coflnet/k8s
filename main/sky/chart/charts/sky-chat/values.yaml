enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skychat
  tag: b97595cb4f3abf45596364e164a8c6e808d3cba8@sha256:c4094ddd7816a4e89cec147fe8da889ec46ae7bf463934ff7ce6d6bf163b9eae
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 300Mi
  limits:
    cpu: 250m
    memory: 500Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_chat_database
  - name: REDIS_HOST
    value: sky-settings-redis

pki:
  enabled: false
  # Mount the projected client certificate, trust bundle and writable HOME without
  # any application TLS/PKI setting (old-image preparation phase).
  mountsEnabled: false
  applicationEnabled: false
  readinessEnabled: false
  homeEnv: {}
