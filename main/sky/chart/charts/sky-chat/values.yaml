enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skychat
  tag: eb26b90696b197b255bb2b7ff5f405845cf9e340@sha256:3bbed11a7d1d2bcc4df0f70c0ec76718ef8929982af6237e2aecb26c740b4257
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 300Mi
  limits:
    cpu: 250m
    memory: 500Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_chat_database
  - name: REDIS_HOST
    value: sky-settings-redis

pki:
  enabled: false
  # Mount the projected client certificate, trust bundle and writable HOME without
  # any application TLS/PKI setting (old-image preparation phase).
  mountsEnabled: false
  applicationEnabled: false
  readinessEnabled: false
  homeEnv: {}
