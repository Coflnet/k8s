enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skychat
  tag: fac5107114c1719bde98b61d003f27b2be2d1fed@sha256:33223eb6544c5202cc4f4af19c9ca9117b0c0f072b975d5a6aee87e11c4d3233
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 300Mi
  limits:
    cpu: 250m
    memory: 500Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_chat_database
  - name: REDIS_HOST
    value: sky-settings-redis

pki:
  enabled: false
  # Mount the projected client certificate, trust bundle and writable HOME without
  # any application TLS/PKI setting (old-image preparation phase).
  mountsEnabled: false
  applicationEnabled: false
  readinessEnabled: false
  homeEnv: {}
