enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skychat
  tag: 3f9ecc3d88ca4feda575b44ffe05fc3c244d2867@sha256:f6c442bf2c3ef6489db1b2ec5c887456dfd11fae57755c0523353988bfe6d9f9
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 300Mi
  limits:
    cpu: 250m
    memory: 500Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_chat_database
  - name: REDIS_HOST
    value: sky-settings-redis

pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
