enabled: true
# Steady state is a single instance: sky-items collides on DB writes and runs
# slower with 2 concurrent instances. During a version rollout it runs 2 for the
# length of the analysis window (~3 min, see canary below) so the candidate takes
# real traffic and its error rate can be judged before the old pod is retired.
replicaCount: 1

rollout:
  enabled: true

# PodDisruptionBudget: refuses voluntary disruption (node drain, host upgrade)
# that would take the sole pod below minAvailable: 1. Note this only blocks
# eviction - it does NOT surge a replacement first - so a node drain targeting
# this pod will stall/fail rather than silently dropping to zero instances.
# To drain that node without downtime, scale to 2 first, let the new pod go
# Ready, drain, then scale back to 1.
pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true

image:
  repository: muehlhansfl/skyitems
  tag: 5c3f8b81fbfef2e3f3d1b058a0e82d684070771c
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 200m
    memory: 512Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

analysisTemplate: &analysisTemplate sky-items
canaryService: &canaryService sky-items-preview
stableService: &stableService sky-items-stable
canary:
  # No trafficRouting: this cluster has no service mesh and no SMI TrafficSplit
  # CRD, so weight is a replica ratio, not a traffic share. Both pods sit behind
  # the sky-items Service and split requests roughly evenly - which is precisely
  # what makes the candidate's error rate measurable.
  #
  # setWeight: 50 with replicaCount 1 resolves to stable = ceil(1 * 0.5) = 1 and
  # candidate = ceil(1 * 0.5) = 1, so the known-good pod is never scaled down.
  # A failed analysis then aborts by deleting the candidate alone: instant
  # rollback, no downtime, no revert commit. setWeight: 100 would resolve stable
  # to 0 and retire the good pod before the candidate has proven itself.
  steps:
    - setWeight: 50
    - analysis:
        templates:
          - templateName: *analysisTemplate
        args:
          - name: pod-hash
            valueFrom:
              podTemplateHashValue: Latest
  maxSurge: 1
  maxUnavailable: 0
  canaryService: *canaryService
  stableService: *stableService

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  periodSeconds: 3
livenessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  periodSeconds: 3
  failureThreshold: 5

envVars:
  - name: DBCONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_read_secondary
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_items_database
