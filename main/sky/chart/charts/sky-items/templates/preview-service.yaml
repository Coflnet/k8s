{{- if and .Values.enabled (or (not (hasKey .Values "rollout")) .Values.rollout.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-preview
  # Deliberately not app: {{ .Chart.Name }} - that label is what the ServiceMonitor
  # selects on, and matching here would scrape every pod a second time.
  labels:
    app: {{ .Chart.Name }}-preview
spec:
  # .spec.selector is owned by Argo Rollouts (canary canaryService); omitted so
  # Fleet's server-side apply does not conflict with the rollouts-controller.
  ports:
    {{ toYaml .Values.serivcePorts | nindent 4 }}
---
{{- end }}
