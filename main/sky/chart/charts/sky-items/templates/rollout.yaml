{{ if and .Values.enabled (or (not (hasKey .Values "rollout")) .Values.rollout.enabled) }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
  annotations:
    fleet.cattle.io/ignore-drift: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        security.coflnet.com/k8s-api-access: "false"
      annotations:
        {{ toYaml .Values.global.podAnnotations | nindent 8 }}
        {{- if and .Values.pki.enabled .Values.pki.applicationEnabled }}
        security.coflnet.com/pki-revision: {{ .Values.pki.revision | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      {{- if $.Values.global.openbaoAuthPath }}
      automountServiceAccountToken: false
      {{- end }}
      # Prefer to spread replicas across nodes so a single node loss keeps at
      # least one pod. Soft (preferred) on purpose: a hard rule would block the
      # surge pod during a rollout or leave a pod Pending during node maintenance.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: {{ .Chart.Name }}
              topologyKey: kubernetes.io/hostname
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if or $.Values.global.openbaoAuthPath (and .Values.pki.enabled .Values.pki.applicationEnabled) }}
        fsGroup: 1000
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        image: {{ .Values.image.repository }}:{{ .Values.image.tag  }}
        ports:
           {{ toYaml .Values.ports | nindent 10 }}
        env:
          {{- if and .Values.pki.enabled .Values.pki.applicationEnabled }}
          {{- range $name, $value := .Values.pki.env }}
          - name: {{ $name }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          - name: OPENBAO__ENABLED
            value: "true"
          - name: OPENBAO__OPTIONAL
            value: {{ ternary "false" "true" (not (empty $.Values.global.openbaoAuthPath)) | quote }}
          - name: OPENBAO__ADDR
            value: {{ .Values.global.openbaoAddr | default "http://openbao.openbao.svc:8200" }}
          - name: OPENBAO__MOUNT
            value: kv
          - name: OPENBAO__PATH
            value: {{ printf "sky/%s" .Chart.Name | quote }}
          - name: OPENBAO__ROLE
            value: {{ .Chart.Name | quote }}
          {{- if $.Values.global.openbaoAuthPath }}
          - name: OPENBAO__AUTH_PATH
            value: {{ $.Values.global.openbaoAuthPath | quote }}
          - name: OPENBAO__TOKEN_PATH
            value: /var/run/secrets/openbao/token
          {{- if $.Values.global.openbaoTLSServerName }}
          - name: OPENBAO__TLS_SERVER_NAME
            value: {{ $.Values.global.openbaoTLSServerName | quote }}
          {{- end }}
          - name: OPENBAO__REQUEST_TIMEOUT_SECONDS
            value: "5"
          - name: OPENBAO__STARTUP_RETRY_SECONDS
            value: "90"
          - name: OPENBAO__RETRY_DELAY_SECONDS
            value: "2"
          {{- end }}
          {{- if $.Values.global.openbaoCACert }}
          - name: OPENBAO__CACERT
            value: /openbao/tls/ca.crt
          {{- end }}
          {{ if .Values.envVars }}
          {{ include "coflnet.envVars" (dict "root" . "env" .Values.envVars "excludeNames" (ternary (list "DBCONNECTION" "DB_CONNECTION") (list) (not (empty $.Values.global.openbaoAuthPath)))) | nindent 10 }}
          {{ end }}
          {{ include "coflnet.envVars" (dict "root" . "env" .Values.global.envVars "excludeNames" (ternary (list "KAFKA__BROKERS" "KAFKA__USERNAME" "KAFKA__PASSWORD") (list) (not (empty $.Values.global.openbaoAuthPath)))) | nindent 10 }}
          {{ include "coflnet.envVars" (dict "root" . "env" .Values.global.frontendEnvVars) | nindent 10 }}
        readinessProbe:
          {{- if and .Values.pki.enabled .Values.pki.applicationEnabled .Values.pki.readinessEnabled }}
          {{ toYaml (mergeOverwrite (deepCopy .Values.readinessProbe) (dict "httpGet" (dict "path" "/health/ready" "port" "api"))) | nindent 10 }}
          {{- else }}
          {{ toYaml .Values.readinessProbe | nindent 10 }}
          {{- end }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{ toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        resources:
          {{ toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        {{- if and .Values.pki.enabled .Values.pki.applicationEnabled }}
        - {name: pki-client, mountPath: /pki/client, readOnly: true}
        - {name: pki-trust, mountPath: /pki/trust, readOnly: true}
        - {name: pki-home, mountPath: /tmp/pki-home}
        {{- end }}
        {{- if $.Values.global.openbaoAuthPath }}
        - name: openbao-workload-token
          mountPath: /var/run/secrets/openbao
          readOnly: true
        {{- end }}
        {{ range .Values.global.volumes }}
        - name: {{ .mountName }}
          mountPath: {{ .mountPath }}
        {{ end }}
      volumes:
      {{- if and .Values.pki.enabled .Values.pki.applicationEnabled }}
        - name: pki-client
          secret: {secretName: sky-items-client, defaultMode: 0440}
        - name: pki-trust
          configMap: {name: sky-items-pki-trust}
        - name: pki-home
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
      {{- end }}
      {{- if $.Values.global.openbaoAuthPath }}
        - name: openbao-workload-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 600
                  path: token
      {{- end }}
      {{ range .Values.global.volumes }}
        - name: {{ .mountName }}
          {{ if eq .type "configmap"  }}
          configMap:
            name: {{ .name }}
          {{ else}}
          secret:
            secretName: {{ .name }}
          {{ end }}
      {{ end }}
  strategy:
    canary:
{{- if .Values.canary.trafficRouting }}
{{ toYaml .Values.canary | nindent 6 }}
{{- else }}
{{- $canary := omit .Values.canary "trafficRouting" }}
{{ toYaml $canary | nindent 6 }}
{{- end }}
{{ end }}
