enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skymcconnect
  tag: 2a7109bb4a678f2409734598cf3e449f707dc2f7@sha256:ce3fc52d704a7d473f0ab30de8de4e2f314b8ed02d742324f0518ccd32aa4384
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 340Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_micro_mc_connect

pki:
  enabled: false
  applicationEnabled: false
