enabled: true
replicaCount: 1

strategy: RollingUpdate

image:
  repository: muehlhansfl/skymcconnect
  tag: e612024fa117b69811c61ef875b073293bf901cd@sha256:7078ca16a52546e91fdb7bb872af705cc530978fd4b5c1b958195ade03cc20f0
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 340Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/index.html
    port: api
  initialDelaySeconds: 20
  timeoutSeconds: 5
  periodSeconds: 3

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        name: secret
        key: connection_micro_mc_connect
