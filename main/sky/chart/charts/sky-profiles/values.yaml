enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyprofiles
  tag: 8744d6183a2b4b2ffae27cf3e9de8e3174c5044a@sha256:d76f7b8a73c510c0782bf91358a10fb1ac0887d3de6f44a725a918d4f9049b4b
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 512Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/profile/index.html
    port: api
  initialDelaySeconds: 20

envVars:
  - name: CASSANDRA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: CASSANDRA__USER
    value: sky_player_info
  - name: CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: secret
        key: sky_profile_cassandra_password
  - name: CASSANDRA__KEYSPACE
    value: sky_player_info

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

# External CQL identity issuance and application use are separate EU-only phases.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
