enabled: true
replicaCount: 2

strategy: RollingUpdate

image:
  repository: muehlhansfl/skyprofiles
  tag: 643171f3b0ec0e22ce79a0227d6526525a1ebe65@sha256:fee9c0b3ba8d84a9fb0c0869eb2a3a7f4d7497ed8825db93b4d9cc1006723e72
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 512Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /api/profile/index.html
    port: api
  initialDelaySeconds: 20

envVars:
  - name: CASSANDRA__HOSTS
    valueFrom:
      configMapKeyRef:
        name: scylla-config
        key: scylla_host
  - name: CASSANDRA__USER
    value: sky_player_info
  - name: CASSANDRA__PASSWORD
    valueFrom:
      secretKeyRef:
        name: secret
        key: sky_profile_cassandra_password
  - name: CASSANDRA__KEYSPACE
    value: sky_player_info

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

# External CQL identity issuance and application use are separate EU-only phases.
pki:
  enabled: false
  applicationEnabled: false
  readinessEnabled: false
