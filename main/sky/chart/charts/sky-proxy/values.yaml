enabled: true
nodeSelector: {}
image:
  repository: muehlhansfl/skyproxy
  tag: b3315d75ccb0586a32aee83eeb1756a55e4ffb5c@sha256:843be7a29d489e47aa37f35683ec86ab90124788229a2fe000dac88ec636f61c
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 650Mi
  limits:
    memory: 1536Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /proxy/hypixel/status
    port: api
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 10

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        key: connection_cockroach_proxy_database
        name: secret
  - name: TOPICS__NEW_AUCTION
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_new_auction-raw
  - name: TOPICS__SOLD_AUCTION
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_sold_auction-raw
  - name: TOPICS__NEW_BID
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_new_bid-raw

strategy:
  type: RollingUpdate
  rollingUpdate:
    # start one new pod before terminating the old one
    maxSurge: 1
    # keep the old pod until the new pod is ready
    maxUnavailable: 0

# CockroachDB SQL client certificate (EU only, see chart/proxy-pki-eu.yaml). Issuance, client/trust/HOME mounts, application TLS and the
# readiness move are separate phases; everything defaults off and other clusters never enable it.
pki:
  enabled: false
  # Mount the client certificate, trust bundle and writable HOME without any application setting (old image).
  mountsEnabled: false
  # Adds pki.env (DB__TLS__*) to the container.
  applicationEnabled: false
  # Moves the kubelet readinessProbe to /health/ready (needs applicationEnabled and an image that serves it).
  readinessEnabled: false
  homeEnv: {}
  env: {}
