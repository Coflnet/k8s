enabled: true
nodeSelector: {}
image:
  repository: muehlhansfl/skyproxy
  tag: 1ec249b799fe735a5465043f43687da439fc16b5@sha256:fd38d8e2846afbd34241bde08d0b3173ded1b9f7ee145b5621173f6b9887ee68
  pullPolicy: IfNotPresent

ports:
  - name: api
    containerPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 650Mi
  limits:
    memory: 1536Mi

serivcePorts:
  - name: api
    port: 8000
    targetPort: 8000

readinessProbe:
  httpGet:
    path: /proxy/hypixel/status
    port: api
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 10

envVars:
  - name: DB_CONNECTION
    valueFrom:
      secretKeyRef:
        key: connection_cockroach_proxy_database
        name: secret
  - name: TOPICS__NEW_AUCTION
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_new_auction-raw
  - name: TOPICS__SOLD_AUCTION
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_sold_auction-raw
  - name: TOPICS__NEW_BID
    valueFrom:
      configMapKeyRef:
        name: config
        key: topic_new_bid-raw

strategy:
  type: RollingUpdate
  rollingUpdate:
    # start one new pod before terminating the old one
    maxSurge: 1
    # keep the old pod until the new pod is ready
    maxUnavailable: 0

# CockroachDB SQL client certificate (EU only, see chart/proxy-pki-eu.yaml). Issuance, client/trust/HOME mounts, application TLS and the
# readiness move are separate phases; everything defaults off and other clusters never enable it.
pki:
  enabled: false
  # Mount the client certificate, trust bundle and writable HOME without any application setting (old image).
  mountsEnabled: false
  # Adds pki.env (DB__TLS__*) to the container.
  applicationEnabled: false
  # Moves the kubelet readinessProbe to /health/ready (needs an image that serves it; independent of applicationEnabled).
  readinessEnabled: false
  # Mounts the Kafka client leaf (Secret sky-proxy-client) at /pki/kafka-client; pki-client stays the Cockroach leaf.
  kafkaClientEnabled: false
  homeEnv: {}
  env: {}
