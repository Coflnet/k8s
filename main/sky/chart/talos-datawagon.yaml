# Talos Datawagon overlay (two-node, replaces us-data-wagon).
# No OpenBao — all creds via k8s secrets.
# Cilium CNI — no Linkerd sidecar.

global:
  # Cilium CNI, not Linkerd.
  podAnnotations: {}

  # Public images on Docker Hub.
  imagePullSecrets: []

  redis:
    enabled: false

  secret:
    enabled: false

  config:
    enabled: false

  # S3/R2 credentials for state loading (read-only).
  minioEnvVars:
    - name: MINIO_HOST
      valueFrom:
        configMapKeyRef:
          key: host
          name: minio
    - name: MINIO_SECRET
      valueFrom:
        secretKeyRef:
          key: secret_key
          name: minio
    - name: MINIO_KEY
      valueFrom:
        secretKeyRef:
          key: access_key
          name: minio

  envVars:
    - name: RATE_LIMITER_REDIS_HOST
      value: sky-commands-redis
    - name: SETTINGS_REDIS_HOST
      value: sky-settings-redis-eu-cluster
    - name: JAEGER_AGENT_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_EXPORTER_JAEGER_AGENT_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-collector-eu-cluster.observability:4317

    # Base URLs — cross-cluster communication back to eu-cluster services.
    - name: API_BASE_URL
      value: http://sky-api:8000
    - name: BAZAAR_BASE_URL
      value: http://sky-bazaar-eu-cluster:8000
    - name: BAZAARFLIPPER_BASE_URL
      value: http://sky-bazaar-flipper-eu-cluster:8000
    - name: ITEMS_BASE_URL
      value: http://sky-items-eu-cluster:8000
    - name: MAYOR_BASE_URL
      value: http://sky-mayor-eu-cluster:8080
    - name: PLAYERNAME_BASE_URL
      value: http://sky-player-name-eu-cluster:8000
    - name: PLAYERNAME_URL
      value: http://sky-player-name-eu-cluster:8000
    - name: REFERRAL_BASE_URL
      value: http://sky-referral-eu-cluster:8000
    - name: SETTINGS_BASE_URL
      value: http://sky-settings-eu-cluster:8000
    - name: SNIPER_BASE_URL
      value: http://sky-sniper-eu-cluster:8000
    - name: INDEXER_BASE_URL
      value: http://sky-indexer-eu-cluster:8000
    - name: SUBSCRIPTION_BASE_URL
      value: http://sky-subscriptions-eu-cluster:8000
    - name: SKYFLIPPER_BASE_URL
      value: http://sky-flipper-eu-cluster:8000
    - name: SKYCOMMANDS_BASE_URL
      value: http://sky-commands-eu-cluster:8008
    - name: PAYMENTS_BASE_URL
      value: http://sky-payments-eu-cluster.payment:8000
    - name: PROFILE_BASE_URL
      value: http://sky-profiles-eu-cluster:8000
    - name: PLAYERSTATE_BASE_URL
      value: http://sky-player-state-eu-cluster:8000
    - name: CRAFTS_BASE_URL
      value: http://sky-crafts-eu-cluster:8000
    - name: UPDATER_BASE_URL
      value: http://sky-updater-eu-cluster:8000
    - name: MCCONNECT_BASE_URL
      value: http://sky-mc-connect-eu-cluster:8000
    - name: FLIPTRACKER_BASE_URL
      value: http://sky-flip-tracker-eu-cluster:8000
    - name: CHAT_BASE_URL
      value: http://sky-chat-eu-cluster:8000
    - name: PROXY_BASE_URL
      value: http://sky-proxy-eu-cluster:8000
    - name: LEADERBOARD_BASE_URL
      value: http://leaderboard-eu-cluster.leaderboard:8000
    - name: EVENTS_BASE_URL
      value: http://sky-event-broker-eu-cluster:8000
    - name: TRADE_BASE_URL
      value: http://sky-trade-eu-cluster:8000
    - name: AUCTIONS_BASE_URL
      value: http://sky-auctions-eu-cluster:8000

  volumes: []

# ─── Sub-charts ──────────────────────────────────────────────────────────────

deprecated:
  enabled: false
edge-redis:
  enabled: false
hypixel-react:
  enabled: false

sky-api:
  enabled: false
sky-auctions:
  enabled: false
sky-bazaar:
  enabled: false
sky-bazaar-flipper:
  enabled: false

sky-bfcs:
  enabled: true
  serviceMonitor:
    enabled: false
  metrics:
    enabled: false
  replicaCount: 1
  strategy: RollingUpdate
  defaultEnvVarsEnabled: false
  externalMinio: true
  ingress:
    enabled: true
    tls:
      enabled: true
    nginx: false
    host: us-datawagon.coflnet.com
  envVars:
    - name: JAEGER_AGENT_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_EXPORTER_JAEGER_AGENT_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-collector-eu-cluster.observability:4317
    - name: SNIPER_BASE_URL
      value: http://sky-sniper-eu-cluster:8000
    # No local Redis here: the flip mesh has exactly two instances, on talos-linode
    # and talos-cloudfanatic, both reached over their NodePort. All credentials come
    # from the sky-bfcs-redis-auth Secret (see scripts/rotate-bfcs-redis.sh).
    - name: FLIP_REDIS_OPTIONS
      valueFrom:
        secretKeyRef:
          name: sky-bfcs-redis-auth
          key: connection
    # Consumes from every instance in the mesh: SkyBFCS embeds SkyModCommands, whose
    # ModBackgroundService.SubscribeToRedisSnipes subscribes to each entry here.
    # Keep the indices contiguous from 0 - they bind as a string[].
    - name: REDIS_FLIP_INSTANCES__0
      valueFrom:
        secretKeyRef:
          name: sky-bfcs-redis-auth
          key: linode
    - name: REDIS_FLIP_INSTANCES__1
      valueFrom:
        secretKeyRef:
          name: sky-bfcs-redis-auth
          key: cloudfanatic
  redis:
    enabled: false

sky-chat:
  enabled: false
sky-controller:
  enabled: false
sky-crafts:
  enabled: false
sky-event-broker:
  enabled: false
sky-flip-tracker:
  enabled: false
sky-flipper:
  enabled: false
sky-indexer:
  enabled: false
sky-items:
  enabled: false
sky-mayor:
  enabled: false
sky-mc-connect:
  enabled: false
sky-mod-commands:
  enabled: false
sky-commands:
  enabled: false
sky-player-name:
  enabled: false
sky-player-state:
  enabled: false
sky-profiles:
  enabled: false
sky-proxy:
  enabled: false
sky-settings:
  enabled: false
sky-sniper:
  enabled: false
sky-subscriptions:
  enabled: false
sky-trade:
  enabled: false
sky-updater:
  enabled: false
sky-referral:
  enabled: false

sky-operator:
  enabled: false
crafatar:
  enabled: false
extra-chart:
  enabled: false
necwebsite:
  enabled: false
