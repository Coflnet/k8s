    certificates:
    - name: sky-api-client
      commonName: sky-api.sky.talos-eu.clients.coflnet.internal
      dnsNames: [sky-api.sky.talos-eu.clients.coflnet.internal]
      usages: [digital signature, client auth]
    env:
      HOME: /tmp/pki-home
      # MariaDB client on the own leaf (2026-11-11): SkyCore 1.0.5 DatabaseTlsFactory presents it on every new
      # physical HypixelContext/ArchiveContext connection (SslMode=Required, strict server check against
      # mariadb-ca.crt). SHARED_CONTEXT is the explicit opt-in. Accounts are not bound yet (password still
      # required). Rollback = remove these four keys.
      DB__TLS__CA_CERT_PATH: /pki/trust/mariadb-ca.crt
      DB__TLS__CERT_PATH: /pki/client/tls.crt
      DB__TLS__KEY_PATH: /pki/client/tls.key
      DB__TLS__SHARED_CONTEXT: "true"
      # Kafka client on the own short-lived leaf (renewed in-process) instead of the shared /
      # legacy cert; the SASL user stays the principal. These keys override global.envVars.
      # Rollback = remove these four keys.
      KAFKA__TLS__CA_LOCATION: /pki/trust/kafka-ca.crt
      KAFKA__TLS__CERTIFICATE_LOCATION: /pki/client/tls.crt
      KAFKA__TLS__KEY_LOCATION: /pki/client/tls.key
      KAFKA__TLS__RELOAD_ON_CHANGE: "true"
