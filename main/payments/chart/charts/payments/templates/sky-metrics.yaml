{{- if and .Values.enabled .Values.monitoring.enabled }}
{{- range $p := .Values.payments }}
{{- if eq $p.name "sky-payments" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sky-payments
  namespace: {{ $.Release.Namespace }}
  labels: {release: prometheus}
spec:
  namespaceSelector:
    matchNames: [{{ $.Release.Namespace | quote }}]
  selector:
    matchLabels: {app: sky-payments}
  endpoints: [{port: api, path: /metrics, interval: 30s, scrapeTimeout: 10s}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-payments-allow-prometheus-metrics
spec:
  podSelector:
    matchLabels: {app: sky-payments}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: prometheus}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{protocol: TCP, port: 8000}]
{{- if $.Values.networkPolicy.cilium.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-allow-sky-payments-metrics
  namespace: prometheus
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  egress:
    - toEndpoints:
        - matchLabels: {io.kubernetes.pod.namespace: {{ $.Release.Namespace }}, app: sky-payments}
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
{{- end }}
{{- end }}
{{- end }}
{{- end }}
