{{ range $p := .Values.payments }}
{{ if and $p.ingress.enabled (not $.Values.ingressRetired) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $p.name }}
  annotations:
    {{ if $p.ingress.nginx }}
    kubernetes.io/ingress.class: nginx
    {{ end }}
spec:
  rules:
    {{ toYaml $p.ingress.hosts | nindent 4 }}
---
{{ end }}
{{ end }}
