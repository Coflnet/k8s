{{- $tlsConfig := (.Values.global | default dict).redisOptionalTls | default dict }}
{{- $upgrade := (.Values.global | default dict).redisUpgrade | default dict }}
{{- $tls := and $tlsConfig.enabled $tlsConfig.listenersEnabled (has "redis" (dig "listenerServices" ($tlsConfig.services | default list) $tlsConfig)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: {{ if index ($upgrade.retired | default dict) "redis" }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      {{- if $tls }}
      securityContext:
        fsGroup: 999
      {{- end }}
      containers:
      - name: redis
        image: valkey/valkey:7.2@sha256:cbfcb3772ceb0f87ba2bfb2948a3339659696538e9456c0da23edc99fdefb70a
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        {{- if $tls }}
        args:
        {{- include "coflnet.redisOptionalTls.args" . | nindent 8 }}
        volumeMounts:
        {{- include "coflnet.redisOptionalTls.mount" . | nindent 8 }}
        {{- end }}
        ports:
        - containerPort: 6379
      {{- if $tls }}
      {{- include "coflnet.redisOptionalTls.reloader" (dict "serverName" (printf "%s.%s.svc.cluster.local" "redis" $.Release.Namespace)) | nindent 6 }}
      volumes:
      {{- include "coflnet.redisOptionalTls.volume" (dict "name" "redis" "config" $tlsConfig) | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
    {{- with index ($upgrade.routes | default dict) "redis" }}
    redis-route: {{ . | quote }}
    {{- end }}
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
