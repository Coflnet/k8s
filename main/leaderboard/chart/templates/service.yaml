apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
    # Request-driven over Scylla; RollingUpdate already overlaps two replicas.
    maintenance.coflnet.com/drain-policy: handoff
  annotations:
    maintenance.coflnet.com/max-downtime-seconds: "0"
spec:
  selector:
    app: {{ .Chart.Name }}
  ports:
    {{ toYaml .Values.serivcePorts | nindent 4 }}
    {{- if (.Values.pki | default dict).applicationEnabled }}
    - {name: https, port: 8443, targetPort: https}
    {{- end }}
---
