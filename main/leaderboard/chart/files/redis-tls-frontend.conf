worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
stream {
  # Public certificate identity only; omit plaintext probes and all Redis payloads.
  log_format pki 'tls_client_verify=$ssl_client_verify tls_client_serial=$ssl_client_serial';
  access_log /dev/stdout pki if=$ssl_protocol;
  resolver CLUSTER_DNS valid=30s ipv6=off;
  upstream redis_local {
    zone redis_local 64k;
    server REDIS_LOCAL_BACKEND:6379 resolve;
  }
  server {
    listen 6380 ssl;
    ssl_certificate /optional-tls/tls.crt;
    ssl_certificate_key /optional-tls/tls.key;
    ssl_client_certificate /optional-tls/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 3;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 5s;
    proxy_timeout 7d;
    proxy_half_close on;
    proxy_pass redis_local;
  }
}
